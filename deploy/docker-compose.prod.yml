# Production stack for a single VM (Oracle Cloud Always Free, or any VPS).
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Values come from the .env file in the project root; nothing is hardcoded here.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # FrankenPHP terminates TLS itself when SERVER_NAME is a real domain.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
    env_file: ../.env
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - storage:/app/storage/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --tries=1 --timeout=90 --sleep=3 --max-time=3600
    env_file: ../.env
    volumes:
      - storage:/app/storage/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
