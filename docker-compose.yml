# Production-like stack on your own machine:
#   cp .env.example .env && docker compose up --build
#   docker compose exec app php artisan key:generate
#   docker compose exec app php artisan migrate --seed --seeder=DemoSeeder
#
# The web container, the queue worker and the scheduler all run the same
# image — exactly how it is deployed.

x-app-env: &app-env
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: api_scanner
  DB_USERNAME: api_scanner
  DB_PASSWORD: secret
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database

services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: php artisan queue:work --tries=1 --timeout=90 --sleep=3
    env_file: .env
    environment: *app-env
    depends_on:
      app:
        condition: service_started

  scheduler:
    build: .
    command: php artisan schedule:work
    env_file: .env
    environment: *app-env
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: api_scanner
      MYSQL_USER: api_scanner
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
